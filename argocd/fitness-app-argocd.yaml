apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitness-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sudipti1234/Fitness-Tracker-Dynamic-Volumes.git
    targetRevision: azure-devops
    path: charts/fitness-app
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: fitness-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
