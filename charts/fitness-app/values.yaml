namespace: fitness-ns

fitnessApp:
  name: fitness-tracker-app
  replicas: 2

  image:
    repository: fitnessacr123.azurecr.io/fitness-app
    tag: "418"

  containerPort: 5000

  service:
    name: fitness-tracker-service
    type: LoadBalancer
    port: 80
    targetPort: 5000

  env:
    MONGODB_URI: mongodb://mongodb-service:27017/fitness-tracker
    PORT: "5000"
    HOST: "0.0.0.0"
    NODE_ENV: production

  datadog:
    logsSource: nodejs
    service1: fitness-tracker-service
    service2: fitness-tracker-app
    tracePort: "8126"
    env: production
    service: fitness-tracker-app
    version: "1.0.0"

configMap:
  name: fitness-configmap

# ✅ PVC only REFERENCES existing StorageClass (does NOT create it)
fitnessPVC:
  name: fitness-tracker-pvc
  accessMode: ReadWriteMany
  storageClassName: azurefile-csi
  size: 10Gi

mongodb:
  name: mongodb
  replicas: 2

  image: mongo
  tag: "418"
  containerPort: 27017

  service:
    name: mongodb-service
    type: ClusterIP
    port: 27017

  pvc:
    name: mongodb-pvc
    accessMode: ReadWriteOnce
    storageClassName: managed-csi
    size: 20Gi

secret:
  name: mongodb-secret
  username: admin
  password: StrongPassword123!

